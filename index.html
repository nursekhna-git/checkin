<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 휴대폰 화면 폭에 맞추고, 확대 없이 1:1로 보이게 함 -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>출석체크</title>
<style>
  /* 페이지 자체는 여백·스크롤 없이 화면 전체를 출석 화면에 내어 줌 */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f6f9; }
  /* 출석 화면(Apps Script 웹 앱)을 화면 크기 그대로 꽉 채움
     → 휴대폰을 돌리면 출석 화면도 같이 가로/세로로 바뀜
     (아이폰 주소창 때문에 높이가 어긋나지 않도록 top/bottom 고정 방식 사용) */
  iframe { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<!-- 출석 웹 앱 주소(/exec). 배포 주소가 바뀌면 이 src만 고치면 됨 -->
<iframe src="https://script.google.com/macros/s/AKfycbyh_tEMreOLy8WnduqllKnVGmUu7xF6jUiT2umdu1wjQJiHCALZvDQM4m7DBDMZPCc2AQ/exec"
        title="출석체크"></iframe>
</body>
</html>
